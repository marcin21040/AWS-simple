name: Build and deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and save Docker image
        env:
          IMAGE_REF: galactic-field-guide:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE_REF" .
          docker save "$IMAGE_REF" | gzip -1 > "$RUNNER_TEMP/galactic-field-guide.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: galactic-field-guide-image
          path: ${{ runner.temp }}/galactic-field-guide.tar.gz
          if-no-files-found: error
          retention-days: 1

  provision:
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.address.outputs.public_ip }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Find or launch Frontend instance
        id: instance
        env:
          TAG_NAME: ${{ vars.TAG_NAME || 'Frontend' }}
          AMI_ID: ${{ vars.AMI_ID }}
          INSTANCE_TYPE: ${{ vars.INSTANCE_TYPE || 't3.micro' }}
          KEY_PAIR_NAME: ${{ vars.KEY_PAIR_NAME }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SECGRP_ID: ${{ vars.SECGRP_ID }}
        run: |
          set -euo pipefail
          for name in AMI_ID KEY_PAIR_NAME SUBNET_ID SECGRP_ID; do
            [[ -n "${!name}" ]] || { echo "Required Actions variable $name is missing." >&2; exit 1; }
          done

          instance_id="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${TAG_NAME}" \
                      "Name=instance-state-name,Values=pending,running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)"

          if [[ -z "$instance_id" || "$instance_id" == "None" ]]; then
            instance_id="$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type "$INSTANCE_TYPE" \
              --key-name "$KEY_PAIR_NAME" \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SECGRP_ID" \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${TAG_NAME}}]" \
              --query 'Instances[0].InstanceId' \
              --output text)"
          fi

          [[ "$instance_id" == i-* ]] || { echo "Could not find or launch an EC2 instance." >&2; exit 1; }
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Wait for instance and get public IP
        id: address
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          public_ip="$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)"
          [[ -n "$public_ip" && "$public_ip" != "None" ]] || {
            echo "The instance has no public IP. Check subnet public-IP assignment and routing." >&2
            exit 1
          }
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: galactic-field-guide-image
          path: ${{ runner.temp }}

      - name: Validate deployment settings
        env:
          EC2_INSTANCE_PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER || 'ec2-user' }}
          APP_PORT: ${{ vars.APP_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$EC2_INSTANCE_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "EC2_INSTANCE_PUBLIC_IP must be an IPv4 address." >&2; exit 1; }
          [[ "$EC2_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "EC2_SSH_USER contains unsupported characters." >&2; exit 1; }
          [[ "$APP_PORT" =~ ^[0-9]+$ ]] && (( APP_PORT >= 1 && APP_PORT <= 65535 )) || { echo "APP_PORT must be between 1 and 65535." >&2; exit 1; }
          [[ -n "$SSH_KEY" ]] || { echo "The SSH_KEY secret is required." >&2; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify target instance
        id: target
        env:
          EC2_INSTANCE_PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${EC2_INSTANCE_PUBLIC_IP}" \
            --query 'Reservations[].Instances[] | [?State.Name==`running`].InstanceId | [0]' \
            --output text)"
          [[ "$instance_id" == i-* ]] || { echo "No running EC2 instance found at the configured public IP in AWS_REGION." >&2; exit 1; }
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Prepare verified SSH connection
        env:
          EC2_INSTANCE_PUBLIC_IP: ${{ needs.provision.outputs.public_ip }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER || 'ec2-user' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ec2_deploy_key"
          chmod 600 "$RUNNER_TEMP/ec2_deploy_key"
          cat > "$RUNNER_TEMP/ec2_ssh_config" <<EOF
          Host ec2-deploy
            HostName ${EC2_INSTANCE_PUBLIC_IP}
            User ${EC2_SSH_USER}
            IdentityFile ${RUNNER_TEMP}/ec2_deploy_key
            UserKnownHostsFile /dev/null
            GlobalKnownHostsFile /dev/null
            StrictHostKeyChecking no
            IdentitiesOnly yes
          EOF
          chmod 600 "$RUNNER_TEMP/ec2_ssh_config"
          ssh-keygen -y -f "$RUNNER_TEMP/ec2_deploy_key" > /dev/null

      - name: Wait for SSH
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if ssh -F "$RUNNER_TEMP/ec2_ssh_config" \
              -o ConnectTimeout=5 ec2-deploy true; then
              echo "SSH is ready."
              exit 0
            fi
            if [[ "$attempt" -lt 30 ]]; then
              sleep 10
            fi
          done
          echo "SSH did not become available before the timeout." >&2
          exit 1

      - name: Copy image to EC2
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scp -F "$RUNNER_TEMP/ec2_ssh_config" \
            "$RUNNER_TEMP/galactic-field-guide.tar.gz" \
            "ec2-deploy:/tmp/galactic-field-guide-${GITHUB_SHA}.tar.gz"

      - name: Run container on EC2
        env:
          GITHUB_SHA: ${{ github.sha }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/ec2_ssh_config" ec2-deploy bash -s -- "$GITHUB_SHA" "$APP_PORT" <<'REMOTE'
          set -Eeuo pipefail
          image_tag="$1"
          app_port="$2"
          image_ref="galactic-field-guide:${image_tag}"
          archive="/tmp/galactic-field-guide-${image_tag}.tar.gz"
          container_name="galactic-field-guide"
          trap 'rm -f "$archive"' EXIT

          docker load --input "$archive"
          docker rm --force "$container_name" >/dev/null 2>&1 || true
          docker run --detach --restart unless-stopped \
            --name "$container_name" \
            --publish "${app_port}:80" \
            "$image_ref"

          for attempt in {1..10}; do
            if docker exec "$container_name" wget -q -O /dev/null http://127.0.0.1/starships; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 2
          done

          current_image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          docker image ls --no-trunc --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk -v current="$current_image_id" '$1 ~ /^galactic-field-guide:/ && $2 != current { print $2 }' \
            | sort -u \
            | while IFS= read -r stale_image_id; do
                [[ -z "$stale_image_id" ]] || docker image rm "$stale_image_id" || true
              done
          REMOTE

      - name: Remove temporary deployment files
        if: always()
        run: rm -f "$RUNNER_TEMP/ec2_deploy_key" "$RUNNER_TEMP/ec2_ssh_config" "$RUNNER_TEMP/galactic-field-guide.tar.gz"